server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular is a single-page app: any path that isn't a real file (e.g.
  # /approvals/1) must still serve index.html so the Angular router can
  # take over client-side, instead of nginx returning a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
