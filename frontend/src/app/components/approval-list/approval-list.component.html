<!-- HERO -->
<section class="list-hero">
  <div class="container list-hero-inner">
    <div class="list-hero-meta">
      <span class="list-icon">🛡️</span>
      <div>
        <h1 class="list-title">Coda di approvazione</h1>
        <p class="list-count">{{ requests.length }} richieste{{ showAll ? '' : ' in attesa' }}</p>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" [checked]="showAll" (change)="toggleShowAll()" />
      Mostra anche approvate/rifiutate
    </label>
  </div>
</section>

<!-- DEMO PANEL -->
<section class="demo-section">
  <div class="container">
    <div class="demo-panel">
      <h2>Simula automazione demo — bozza email</h2>
      <div class="demo-fields">
        <input [(ngModel)]="simCustomerEmail" placeholder="Email cliente" />
        <input [(ngModel)]="simCustomerMessage" placeholder="Messaggio cliente" class="wide" />
        <button class="btn-primary" (click)="runDemoAutomation()">Genera richiesta</button>
      </div>
    </div>
  </div>
</section>

<!-- LIST -->
<section class="list-section">
  <div class="container">
    <div *ngIf="loading" class="state-loading">
      <div class="spinner"></div>
      <p>Caricamento...</p>
    </div>

    <div *ngIf="!loading" class="request-list">
      <a *ngFor="let r of requests" class="request-card" [routerLink]="['/approvals', r.id]">
        <div class="rc-main">
          <span class="rc-type-badge">{{ r.automationType }}</span>
          <h3 class="rc-title">{{ r.title }}</h3>
          <span class="rc-masked">{{ r.sensitiveDataPreview }}</span>
        </div>
        <div class="rc-side">
          <span class="badge" [class]="r.status.toLowerCase()">{{ r.status }}</span>
          <span class="rc-date">{{ r.createdAt | date: 'short' }}</span>
        </div>
      </a>

      <div *ngIf="requests.length === 0" class="state-empty">
        <span class="empty-icon">📭</span>
        <p>Nessuna richiesta in coda.</p>
      </div>
    </div>
  </div>
</section>
