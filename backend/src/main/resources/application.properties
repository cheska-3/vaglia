spring.application.name=approval-gateway

# Default profile: H2 file-based DB, zero setup required (data kept in ./data/approvalgateway.mv.db)
spring.datasource.url=jdbc:h2:file:./data/approvalgateway;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set the ANTHROPIC_API_KEY environment variable to enable real AI drafting.
# Without it, AiDraftingService returns a clearly-labelled mock draft.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-3-5-sonnet-20241022

server.port=8080
