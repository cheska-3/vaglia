spring.application.name=vaglia

# Default profile: H2 file-based DB, zero setup required (data kept in ./data/approvalgateway.mv.db)
spring.datasource.url=jdbc:h2:file:./data/approvalgateway;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set the GEMINI_API_KEY environment variable to enable real AI drafting.
# Free key: https://aistudio.google.com/apikey (no credit card required).
# Without it, AiDraftingService returns a clearly-labelled mock draft.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-3.6-flash

# Max AI-generation requests allowed per rolling time window (protects the free tier quota).
ai.rate-limit.max-requests=5
ai.rate-limit.window-seconds=60

# CORS: comma-separated list of allowed frontend origins. Render sets its own env
# vars per-service; set CORS_ALLOWED_ORIGINS to the deployed frontend's URL there.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Render (and most PaaS hosts) inject PORT and expect the app to listen on it.
server.port=${PORT:8080}
