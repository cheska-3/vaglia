spring.application.name=vaglia

# Default profile: H2 file-based DB, zero setup required (data kept in ./data/approvalgateway.mv.db)
spring.datasource.url=jdbc:h2:file:./data/approvalgateway;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set the GEMINI_API_KEY environment variable to enable real AI drafting.
# Free key: https://aistudio.google.com/apikey (no credit card required).
# Without it, AiDraftingService returns a clearly-labelled mock draft.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-3.6-flash

server.port=8080
