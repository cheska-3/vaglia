# Activate with: --spring.profiles.active=mysql
# Requires a local MySQL 8+ instance with a database named approvalgateway:
#   CREATE DATABASE approvalgateway CHARACTER SET utf8mb4;

spring.datasource.url=jdbc:mysql://localhost:3306/approvalgateway?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
